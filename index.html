<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spyro's Kingdom</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Spyro's Kingdom">
  <meta property="og:title" content="Spyro's Kingdom">
  <meta property="og:description" content="Explore Spyro's Kingdom">
  <meta property="og:url" content="https://spyroskingdom.com/">
  <meta property="og:image" content="https://spyroskingdom.com/embed-image.png">
  <meta property="og:image:width" content="400">
  <meta property="og:image:height" content="400">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    @font-face {
      font-family: 'Markin';
      src: url('assets/markinlt.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Proxima';
      src: url('assets/ProximaNova.otf') format('opentype');
      font-display: swap;
    }
      @font-face {
      font-family: 'Gotham';
      src: url('assets/Gotham.otf') format('opentype');
      font-display: swap;
    }


    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      text-align: center;
      color: #fff;
      font-family: system-ui, sans-serif;
      background: url("assets/SpyrosKingdomWebBG.png") no-repeat center center fixed;
      background-size: cover;

    }
    @keyframes scroll {
      to { background-position-x: 0vh; }
    }

    img {
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
    }

    .masthead {
      position: relative;
      width: 100%;
      margin: 0;
    }
    .nav-bar {
      display: block;
      width: 100%;
      height: auto;
    }
    .masthead { container-type: inline-size; }
    .nav-links {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .nav-group {
      position: absolute;
      top: 57%;
      transform: translateY(-50%);
      width: 20%;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
    }
    .nav-group.left  { left: 11.5%; }
    .nav-group.right { right: 11.8%; }
    .nav-links a {
      pointer-events: auto;
      font-family: 'Proxima', system-ui, sans-serif;
      font-size: max(6px, 1.1cqw);
      line-height: 1;
      color: #fff;
      text-decoration: none;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      padding: 0.1em 0.1em;
      white-space: nowrap;
      transition: color 0.15s, transform 0.15s;
    }
    .nav-links a:hover,
    .nav-links a:focus-visible,
    .nav-links a:active {
      color: #ffd93b;
      transform: scale(1.08);
      outline: none;
    }
    .logo {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 30%;
      height: auto;
      margin: 0;
      transition: transform 0.25s;
    }
    .logo:hover {
      transform: translate(-50%, -50%) scale(1.05);
    }

    .contribute {
      margin: 3vh auto 0;
      padding: 0 16px;
      font-family: 'Gotham', system-ui, sans-serif;
      font-size: clamp(1rem, 3vw, 2.5rem);
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
    }

 
  </style>
</head>
<body>
  <header class="masthead">
    <img class="nav-bar" src="assets/sk-nav.png" alt="">
    <nav class="nav-links">
      <div class="nav-group left">
        <a href="https://spyroskingdom.com/gallery">GALLERY</a>
        <a href="#">ABOUT</a>
      </div>
      <div class="nav-group right">
        <a href="#contribute">CONTRIBUTE</a>
        <a href="https://discord.com/invite/AqPhVkYyYz">DISCORD</a>
      </div>
    </nav>
    <a href="https://spyroskingdom.com"><img class="logo" src="assets/sk-logo.png" alt="Spyro's Kingdom" ></a>
  </header>

  <p class="contribute" id="contribute">WELCOME TO THE SPYRO'S KINGDOM WEBSITE! NOT MUCH IS HERE YET, SO GO TO GALLERY TO SEE SOME AWESOME IMAGES
  </p>

 
  </script>
</body>
</html>
