<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spyro's Kingdom</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Spyro's Kingdom">
  <meta property="og:title" content="Spyro's Kingdom">
  <meta property="og:description" content="Explore Spyro's Kingdom">
  <meta property="og:url" content="https://spyroskingdom.com/">
  <meta property="og:image" content="https://spyroskingdom.com/embed-image.png">
  <meta property="og:image:width" content="400">
  <meta property="og:image:height" content="400">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    @font-face {
      font-family: 'Markin';
      src: url('assets/markinlt.ttf') format('truetype');
      font-display: swap;
    }

    body {
      margin: 0;
      min-height: 100vh;
      text-align: center;
      color: #fff;
      font-family: system-ui, sans-serif;
      background: url("assets/web-bg.png") repeat-x fixed;
      background-size: auto 100vh;
      animation: scroll 60s linear infinite;
    }
    @keyframes scroll {
      to { background-position-x: -250vh; }
    }

    img {
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
    }

    .logo {
      width: 30vw;
      max-width: 100%;
      margin-top: 4vh;
      transition: transform 0.25s;
    }
    .logo:hover {
      transform: scale(1.05);
    }

    .contribute {
      margin: 3vh auto 0;
      padding: 0 16px;
      font-family: 'Markin', system-ui, sans-serif;
      font-size: clamp(1rem, 2vw, 1.6rem);
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
    }

    .gallery {
      columns: 220px;
      column-gap: 12px;
      max-width: 1400px;
      margin: 3vh auto 6vh;
      padding: 0 16px;
    }
    .gallery img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 0 12px;
      border-radius: 8px;
      break-inside: avoid;
      background: rgba(0, 0, 0, 0.25);
      cursor: zoom-in;
      transition: transform 0.25s, box-shadow 0.25s;
    }
    .gallery img:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.85);
      cursor: zoom-out;
      z-index: 10;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 94vw;
      max-height: 94vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img class="logo" src="assets/sk-logo.png" alt="Spyro's Kingdom">

  <p class="contribute">Have images to contribute? Add @shojiki.64 or @gutterbeasts on discord!</p>

  <main class="gallery" id="gallery"></main>
  <div class="lightbox" id="lightbox"><img alt=""></div>

  <script>
    const DIR = 'assets/gallery/';
    const IMG_RE = /\.(png|jpe?g|gif|webp|avif|svg)$/i;

    async function getFileList() {
      try {
        const res = await fetch(DIR + 'gallery.json');
        if (res.ok) return (await res.json()).filter(f => IMG_RE.test(f));
      } catch {}

      try {
        const res = await fetch(DIR);
        if (res.ok) {
          const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
          return [...doc.querySelectorAll('a')]
            .map(a => decodeURIComponent(a.getAttribute('href') || '').split('/').pop())
            .filter(f => IMG_RE.test(f));
        }
      } catch {}

      return [];
    }

    (async () => {
      const gallery = document.getElementById('gallery');
      const files = await getFileList();

      files.forEach(file => {
        const img = document.createElement('img');
        img.src = DIR + encodeURIComponent(file);
        img.alt = file.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
        img.loading = 'lazy';
        gallery.appendChild(img);
      });
    })();

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = lightbox.querySelector('img');
    document.getElementById('gallery').addEventListener('click', e => {
      if (e.target.tagName !== 'IMG') return;
      lightboxImg.src = e.target.src;
      lightboxImg.alt = e.target.alt;
      lightbox.classList.add('open');
    });
    lightbox.addEventListener('click', () => lightbox.classList.remove('open'));
    addEventListener('keydown', e => e.key === 'Escape' && lightbox.classList.remove('open'));
  </script>
</body>
</html>
