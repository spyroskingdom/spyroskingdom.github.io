<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spyro's Kingdom</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Spyro's Kingdom">
  <meta property="og:title" content="Spyro's Kingdom History Museum">
  <meta property="og:description" content="Explore the history of Spyro's Kingdom">
  <meta property="og:url" content="https://spyroskingdom.com/">
  <meta property="og:image" content="https://spyroskingdom.com/embed-image.png">
  <meta property="og:image:width" content="400">
  <meta property="og:image:height" content="400">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      text-align: center;
      color: #fff;
      font-family: system-ui, sans-serif;
      background: url("assets/web-bg.png") repeat-x;
      background-size: auto 100%;
      animation: scroll 60s linear infinite;
    }
    @keyframes scroll {
      to { background-position-x: -250vh; }
    }
    img {
      width: 30vw;
      margin-top: 4vh;
      transition: transform 0.25s;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
    }
    img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <img src="assets/sk-logo.png" alt="Spyro's Kingdom">
</body>
</html>
