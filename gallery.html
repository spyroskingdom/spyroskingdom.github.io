<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spyro's Kingdom</title>
  <link rel="icon" type="image/png" sizes="512x512" href="https://spyroskingdom.com/assets/favicon.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Spyro's Kingdom">
  <meta property="og:title" content="Spyro's Kingdom">
  <meta property="og:description" content="Explore Spyro's Kingdom">
  <meta property="og:url" content="https://spyroskingdom.com/">
  <meta property="og:image" content="https://spyroskingdom.com/embed-image.png">
  <meta property="og:image:width" content="400">
  <meta property="og:image:height" content="400">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    @font-face {
      font-family: 'Markin';
      src: url('assets/markinlt.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Proxima';
      src: url('assets/ProximaNova.otf') format('opentype');
      font-display: swap;
    }
      @font-face {
      font-family: 'Gotham';
      src: url('assets/Gotham.otf') format('opentype');
      font-display: swap;
    }


    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      text-align: center;
      color: #fff;
      font-family: system-ui, sans-serif;
      background: url("assets/SpyrosKingdomWebBG.png") no-repeat center center fixed;
      background-size: cover;

    }
    @keyframes scroll {
      to { background-position-x: 0vh; }
    }

    img {
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
    }

    .masthead {
      position: relative;
      width: 100%;
      margin: 0;
    }
    .nav-bar {
      display: block;
      width: 100%;
      height: auto;
    }
    .masthead { container-type: inline-size; }
    .nav-links {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .nav-group {
      position: absolute;
      top: 57%;
      transform: translateY(-50%);
      width: 18%;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
    }
    .nav-group.left  { left: 12.65%; }
    .nav-group.right { right: 13.1%; }
    .nav-links a {
      pointer-events: auto;
      font-family: 'Proxima', system-ui, sans-serif;
      font-size: max(6px, 1.1cqw);
      line-height: 1;
      color: #fff;
      text-decoration: none;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      padding: 0.1em 0.1em;
      white-space: nowrap;
      transition: color 0.15s, transform 0.15s;
    }
    .nav-links a:hover,
    .nav-links a:focus-visible,
    .nav-links a:active {
      color: #ffd93b;
      transform: scale(1.08);
      outline: none;
    }
    .logo {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 30%;
      height: auto;
      margin: 0;
      transition: transform 0.25s;
    }
    .logo:hover {
      transform: translate(-50%, -50%) scale(1.05);
    }

    .contribute {
      margin: 3vh auto 0;
      padding: 0 16px;
      font-family: 'Gotham', system-ui, sans-serif;
      font-size: clamp(1rem, 2vw, 4rem);
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
    }

    .gallery-wrap {
      max-width: 1400px;
      margin: 3vh auto 6vh;
      padding: 0 16px;
    }
    .group-title {
      font-family: 'Proxima', system-ui, sans-serif;
      font-size: clamp(2rem, 5vw, 4.5rem);
      margin: 6vh 0 2vh;
      text-shadow: 0 3px 8px rgba(0, 0, 0, 0.8);
    }
    .group-grid {
      columns: 220px;
      column-gap: 12px;
    }
    .group-grid img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 0 12px;
      border-radius: 8px;
      break-inside: avoid;
      background: rgba(0, 0, 0, 0.25);
      cursor: zoom-in;
      transition: transform 0.25s, box-shadow 0.25s;
    }
    .group-grid img:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.85);
      cursor: zoom-out;
      z-index: 10;
    }
    .lightbox.open { display: flex; }
    .lb-figure {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .lightbox img {
      max-width: 88vw;
      max-height: 86vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }
    .lb-caption {
      font-family: 'Gotham', system-ui, sans-serif;
      font-size: clamp(0.8rem, 1.4vw, 1.2rem);
      color: #fff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
      word-break: break-all;
      padding: 0 16px;
    }
    .lb-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 72px;
      border: 0;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      font-size: 2.6rem;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .lb-btn:hover,
    .lb-btn:focus-visible {
      background: rgba(0, 0, 0, 0.75);
      color: #ffd93b;
      outline: none;
    }
    .lb-prev { left: 12px; }
    .lb-next { right: 12px; }
    @media (max-width: 600px) {
      .lb-btn { width: 36px; height: 56px; font-size: 2rem; }
      .lb-prev { left: 4px; }
      .lb-next { right: 4px; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <img class="nav-bar" src="assets/sk-nav.png" alt="">
    <nav class="nav-links">
      <div class="nav-group left">
        <a href="#gallery">GALLERY</a>
        <a href="#">ABOUT</a>
      </div>
      <div class="nav-group right">
        <a href="#contribute">CONTRIBUTE</a>
        <a href="https://discord.com/invite/AqPhVkYyYz">DISCORD</a>
      </div>
    </nav>
    <a href="https://spyroskingdom.com"><img class="logo" src="assets/sk-logo.png" alt="Spyro's Kingdom" ></a>

  </header>

  <p class="contribute" id="contribute">WANT TO HELP CONTRIBUTE? ADD @shojiki.64 OR @gutterbeasts ON DISCORD!</p>

  <main class="gallery-wrap" id="gallery"></main>
  <div class="lightbox" id="lightbox">
    <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous image">&#8249;</button>
    <figure class="lb-figure">
      <img alt="">
      <figcaption class="lb-caption" id="lb-caption"></figcaption>
    </figure>
    <button class="lb-btn lb-next" id="lb-next" aria-label="Next image">&#8250;</button>
  </div>

  <script>
    const DIR = 'assets/gallery/';
    const IMG_RE = /\.(png|jpe?g|gif|webp|avif|svg|jfif|bmp)$/i;

    function normalize(data) {
      if (data.length && typeof data[0] === 'string') {
        return [{ title: '', files: data.filter(f => IMG_RE.test(f)) }];
      }
      return data
        .map(g => ({ title: g.title || '', files: (g.files || []).filter(f => IMG_RE.test(f)) }))
        .filter(g => g.files.length);
    }

    async function getGroups() {
      try {
        const res = await fetch(DIR + 'gallery.json');
        if (res.ok) return normalize(await res.json());
      } catch {}

      try {
        const res = await fetch(DIR);
        if (res.ok) {
          const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
          const files = [...doc.querySelectorAll('a')]
            .map(a => decodeURIComponent(a.getAttribute('href') || '').split('/').pop())
            .filter(f => IMG_RE.test(f));
          return normalize(files);
        }
      } catch {}

      return [];
    }

    function fileName(file) {
      try { return decodeURIComponent(file); } catch { return file; }
    }

    function fileUrl(file) {
      return DIR + encodeURIComponent(fileName(file));
    }

    (async () => {
      const gallery = document.getElementById('gallery');
      const groups = await getGroups();

      groups.forEach(group => {
        const section = document.createElement('section');

        if (group.title) {
          const h = document.createElement('h2');
          h.className = 'group-title';
          h.textContent = group.title;
          section.appendChild(h);
        }

        const grid = document.createElement('div');
        grid.className = 'group-grid';

        group.files.forEach(file => {
          const img = document.createElement('img');
          img.src = fileUrl(file);
          img.dataset.file = fileName(file);
          img.alt = file.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
          img.loading = 'lazy';
          grid.appendChild(img);
        });

        section.appendChild(grid);
        gallery.appendChild(section);
      });
    })();

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = lightbox.querySelector('img');
    const caption = document.getElementById('lb-caption');
    let current = -1;

    function thumbs() {
      return [...document.querySelectorAll('#gallery img')];
    }

    function show(i) {
      const list = thumbs();
      if (!list.length) return;
      current = (i + list.length) % list.length;
      const t = list[current];
      lightboxImg.src = t.src;
      lightboxImg.alt = t.alt;
      caption.textContent = t.dataset.file || t.alt;
      lightbox.classList.add('open');
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
    }

    document.getElementById('gallery').addEventListener('click', e => {
      if (e.target.tagName !== 'IMG') return;
      show(thumbs().indexOf(e.target));
    });

    document.getElementById('lb-prev').addEventListener('click', e => {
      e.stopPropagation();
      show(current - 1);
    });
    document.getElementById('lb-next').addEventListener('click', e => {
      e.stopPropagation();
      show(current + 1);
    });

    lightbox.addEventListener('click', closeLightbox);

    addEventListener('keydown', e => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') show(current - 1);
      else if (e.key === 'ArrowRight') show(current + 1);
    });
  </script>
</body>
</html>
